<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Platinum audit{% endblock %}</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap">
<style>
:root{
  --bg:#e9ecef;--panel:#ffffff;--panel-2:#f3f5f7;--ink:#172029;--muted:#5f6b77;--line:#cfd5db;--line-soft:#e3e7eb;
  --accent:#1b5e9e;--focus:#1b5e9e;
  --bad:#b3261e;--bad-bg:#fbe9e7;--warn:#9a6200;--warn-bg:#fff3d6;--ok:#1f7a5c;--ok-bg:#e3f3ec;
  --unv:#5f6b77;--unv-bg:#eceff2;--other:#6b7682;--other-bg:#eef0f2;--radius:6px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1419;--panel:#161d24;--panel-2:#1c252d;--ink:#e8ecf0;--muted:#9aa7b3;--line:#2a3540;--line-soft:#222c35;
  --accent:#7cb7ee;--focus:#7cb7ee;
  --bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f0c36a;--warn-bg:#3a2f14;--ok:#6fd1a8;--ok-bg:#163327;
  --unv:#aab6c2;--unv-bg:#262f38;--other:#9aa7b3;--other-bg:#222b33;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai","Noto Sans Myanmar","Myanmar Text","Pyidaungsu",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
html[lang=my] body,[lang=my]{font-family:"Noto Sans Myanmar","Myanmar Text","Pyidaungsu","IBM Plex Sans Thai",system-ui,sans-serif}
html[lang=my] body{line-height:1.75}
.ledger td.terms{white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1320px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.muted{color:var(--muted)}.small{font-size:13px}
code{font-size:13px;background:var(--panel-2);padding:1px 5px;border-radius:4px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:4px 0 12px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand a{color:inherit;text-decoration:none;font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.langs a{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:13px;line-height:1.6}
.langs a[aria-current=true]{background:var(--ink);color:var(--bg)}
.meta{color:var(--muted);font-size:13px;margin:10px 0 0}

/* glyphs + status colours (one --c / --cbg pair per status, used by pills, chips, strips and panels) */
.g{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.missed,.invalid,.pin_missing,.dead{--c:var(--bad);--cbg:var(--bad-bg)}
.waiting{--c:var(--warn);--cbg:var(--warn-bg)}
.ok{--c:var(--ok);--cbg:var(--ok-bg)}
.unverifiable{--c:var(--unv);--cbg:var(--unv-bg)}
.paused,.manual,.none{--c:var(--other);--cbg:var(--other-bg)}
.pill{--c:var(--muted);--cbg:var(--other-bg);display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:999px;background:var(--cbg);color:var(--c);font-size:13px;font-weight:500;white-space:nowrap;line-height:1.4}
.pill .g{width:14px;height:14px}
.yn{display:inline-flex;color:var(--c)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:14px 0}
.daynav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;text-decoration:none;cursor:pointer;transition:border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.icon{width:36px;padding:0}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.field{display:inline-flex;align-items:center}
.field input,.field select{font:inherit;font-size:14px;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--ink)}
.exports{display:flex;gap:14px;font-size:14px}

/* hero: one number that matters + the share of all contracts */
.hero{display:grid;grid-template-columns:minmax(9rem,13rem) 1fr;gap:16px 32px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin:0 0 18px}
.hero .big{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero .big.bad{color:var(--bad)}
.hero .lbl{font-size:15px;font-weight:500;margin-top:6px}
.hero .sub{color:var(--muted);font-size:13px}
.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:var(--line-soft)}
.bar a{display:block;flex:1 1 0;min-width:6px;transition:flex-grow .35s ease}
.seg.action{background:var(--bad)}.seg.waiting{background:var(--warn)}.seg.ok{background:var(--ok)}.seg.other{background:var(--other)}
.seg.unverifiable{background-color:var(--unv-bg);background-image:repeating-linear-gradient(135deg,var(--unv) 0 3px,transparent 3px 8px)}
.bar a:hover,.bar a:focus-visible{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px 0 8px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-size:13px;background:var(--panel);transition:border-color .15s}
.chip .g{color:var(--c)}
.chip .n{font-weight:600}
.chip.zero{color:var(--muted)}.chip.zero .g{opacity:.45}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip:hover{border-color:var(--ink)}
.cutoff{margin:12px 0 0;font-size:13px;color:var(--muted)}
.cutoff::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:8px;vertical-align:middle}
.cutoff.open::before{background:var(--warn)}

/* the ledger */
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.scroll{overflow-x:auto}
.ledger{border-collapse:collapse;width:100%;font-size:14px}
.ledger th,.ledger td{padding:9px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.ledger thead th{position:sticky;top:0;z-index:1;background:var(--panel-2);font-weight:500;color:var(--muted);white-space:nowrap;font-size:13px;border-bottom:1px solid var(--line)}
.ledger .num{text-align:right;white-space:nowrap}
.ledger tr.band th{--c:var(--other);background:var(--panel);padding:14px 10px 6px;font-size:13px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line)}
.ledger tr.band th::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px;background:var(--c)}
.ledger tr.band[data-band=action] th{--c:var(--bad)}.ledger tr.band[data-band=waiting] th{--c:var(--warn)}.ledger tr.band[data-band=ok] th{--c:var(--ok)}
.ledger tr.band[data-band=unverifiable] th::before{background-color:var(--unv-bg);background-image:repeating-linear-gradient(135deg,var(--unv) 0 2px,transparent 2px 4px)}
.ledger tr.band .count{color:var(--muted);font-weight:400;margin-left:6px}
.ledger tbody tr.row:hover td{background:var(--panel-2)}
.ledger td.name{min-width:16rem;max-width:30rem}
.nm{font-weight:500;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.nm:hover{text-decoration:underline;text-decoration-color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.note{font-size:12.5px;margin-top:3px}
.note.bad{color:var(--bad)}
.frac b{font-weight:600}.frac .sl{color:var(--muted);padding:0 1px}
.evi{color:var(--accent);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.evi:hover{text-decoration:underline}
.empty{padding:40px 24px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:8px}
.foot{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:80ch}

/* contract page */
.crumbs{font-size:14px;margin:14px 0 6px}.crumbs a{text-decoration:none}
h1.title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.25;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:10px 20px;margin:12px 0 0;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.facts div{font-size:14px;min-width:0}.facts .wide{grid-column:1/-1}
.facts dt{color:var(--muted);font-size:12.5px}.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.daypanel{--c:var(--other);display:grid;grid-template-columns:auto 1fr;gap:12px 28px;align-items:center;margin:16px 0;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px}
.daypanel .pill{font-size:15px;padding:4px 12px 4px 8px}.daypanel .pill .g{width:16px;height:16px}
.stats{display:flex;gap:28px;flex-wrap:wrap}.stats .v{font-size:22px;font-weight:600;line-height:1.2}.stats .v.text{font-size:14px;font-weight:400}.stats .k{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:14px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600}
.card h2+.hint{margin:-6px 0 10px}
.card table{border-collapse:collapse;width:100%;font-size:13.5px}.card th,.card td{padding:6px 6px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.card th{color:var(--muted);font-weight:500;font-size:12.5px}
.card .num{text-align:right;white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:4px}
.strip a{--c:var(--other);--cbg:var(--other-bg);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:4px;background:var(--cbg);color:var(--c);text-decoration:none;font-size:11.5px;line-height:1.2}
.strip a .g{width:14px;height:14px}
.strip a.sel{outline:2px solid var(--ink);outline-offset:1px}
.hint{font-size:12.5px;color:var(--muted)}
h2.sec{font-size:16px;font-weight:600;margin:18px 0 8px}
.list{margin:0;padding-left:18px;font-size:13.5px}.list li{margin:2px 0}
.regs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px}.regs b{font-weight:600}

@media (max-width:47.9rem){
  .hero{grid-template-columns:1fr;padding:16px;gap:12px}
  .hero .big{font-size:44px}
  .ledger thead{display:none}
  .ledger,.ledger tbody{display:block}
  .ledger tr.band{display:block}.ledger tr.band th{display:block}
  .ledger tr.row{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  .ledger tr.row td{display:block;padding:0;border:0}
  .ledger td.name{grid-column:1/-1;order:-1;min-width:0;max-width:none}
  .ledger td.ev{grid-column:1/-1;margin-top:4px}
  .ledger td[data-l]{font-size:13px}
  .ledger td[data-l]::before{content:attr(data-l) " ";color:var(--muted)}
  .ledger .num{text-align:left}
  .daypanel{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="g-ok" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="g-missed" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="g-invalid" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
  <symbol id="g-pin_missing" viewBox="0 0 24 24"><path d="M12 17v5M9 11.5V5H8V3h8v2h-1v6.5l2 2.5H7z"/><path d="M3 3l18 18"/></symbol>
  <symbol id="g-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 11.5V5H8V3h8v2h-1v6.5l2 2.5H7z"/></symbol>
  <symbol id="g-unverifiable" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10 10 0 0 1 12 5c5 0 9 7 9 7a16 16 0 0 1-3.3 3.9M6.6 6.6A16 16 0 0 0 3 12s4 7 9 7a9.7 9.7 0 0 0 4.4-1"/></symbol>
  <symbol id="g-waiting" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="g-dead" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
  <symbol id="g-paused" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="g-manual" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="g-none" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="g-prev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="g-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>
<div class="wrap">
<header class="top">
  <div class="brand">
    <a href="/?lang={{ lang }}">Platinum audit</a>
    <span class="sub">{{ t('app.subtitle') }} · {{ tz }}</span>
  </div>
  <nav class="langs" aria-label="{{ t('nav.lang') }}">{% for l in langs %}<a href="{{ switch[l] }}" hreflang="{{ l }}" lang="{{ l }}"{% if l == lang %} aria-current="true"{% endif %}>{{ lang_names[l] }}</a>{% endfor %}</nav>
</header>
{% set meta_line %}{% block meta %}{% endblock %}{% endset %}
{% if meta_line|trim %}<p class="meta">{{ meta_line }}</p>{% endif %}
{% block body %}{% endblock %}
</div>
</body>
</html>
